spring:
  application:
    name: clipforge-backend

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clipforge}
    username: ${DB_USERNAME:clipforge}
    password: ${DB_PASSWORD:clipforge_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-anywhere-real}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 30

cors:
  allowed-origin: ${CORS_ORIGIN:http://localhost:3000}

logging:
  level:
    com.clipforge: DEBUG
    org.springframework.security: INFO

youtube:
  api-key: ${SyCwGcKGFd5Eex_sD2wa0w5hYak9iXGL71w:}